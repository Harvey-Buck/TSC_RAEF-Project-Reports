name: Deploy construction report

on:
  push:
    branches: [main]
    paths:
      - index.html
      - construction-status.html
      - .github/workflows/deploy-construction-report.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage construction report only
        run: |
          mkdir -p _site
          cp index.html construction-status.html _site/
          test "$(find _site -type f | wc -l)" -eq 2
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
